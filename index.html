<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f7">
  <title>ติดตามงาน</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #f6f6f7; overflow: hidden; }
    body { font: 15px/1.5 system-ui, sans-serif; color: #18181b; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #splash {
      position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
      background: #f6f6f7; transition: opacity .25s; text-align: center; padding: 24px;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 72px; height: 72px; }
    #splash h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .spin { width: 22px; height: 22px; border: 3px solid #e4e4e7; border-top-color: #18181b; border-radius: 50%; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    #help { display: none; max-width: 280px; color: #71717a; font-size: 14px; }
    #help a { display: inline-block; margin-top: 10px; padding: 9px 16px; border-radius: 999px; background: #18181b; color: #fff; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <iframe id="app" title="ติดตามงาน" allow="camera; clipboard-write"></iframe>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <h1>ติดตามงาน</h1>
    <div class="spin"></div>
    <div id="help">
      ถ้าค้างนาน อาจยังไม่ได้ล็อกอิน Google ในเครื่องนี้
      <br><a id="login" target="_blank" rel="noopener">ล็อกอิน แล้วกลับมาที่แอป</a>
    </div>
  </div>
  <script>
    // ลิงก์ Web App (Apps Script) ของระบบ
    const APP_URL = 'https://script.google.com/a/macros/rpca.ac.th/s/AKfycbzxXP81tcUJUl7xDS8llJz24r7g_CgIVwcGVSmacjbuJ2zcsPFEr1siWxTklaGy31JU/exec';

    const frame = document.getElementById('app'), splash = document.getElementById('splash');
    document.getElementById('login').href = APP_URL;
    // ระบบจริงส่งสัญญาณ 'tracker-ready' มาเมื่อโหลดข้อมูลเสร็จ (ถ้าล็อกอินไม่ผ่านจะไม่มีสัญญาณ)
    addEventListener('message', e => {
      if (e.data === 'tracker-ready') splash.classList.add('gone');
    });
    setTimeout(() => { document.getElementById('help').style.display = 'block'; }, 8000);
    frame.src = APP_URL;

    // กลับมาที่แอปหลังไปล็อกอิน: โหลดใหม่ถ้ายังค้างอยู่ที่หน้าเริ่ม
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !splash.classList.contains('gone')) frame.src = APP_URL;
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
